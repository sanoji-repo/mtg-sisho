# 【注記】戻し値 0/50 は Ubuntu の初期値（適用前の実値ではない）。
# /etc/sysctl.d/60-sisho-overcommit.conf — 公開サーバー: メモリの貸し出しを厳格にする
# 客の SQL が巨大な値（repeat 等・1 値 1GB 近く）を何本も作ってメモリを使い切る筋書きへの本丸の対策。
# mode 2 = カーネルが確保の瞬間に「上限を超えるので貸せない」と答える＝その SQL だけ PostgreSQL の
#   「out of memory」で止まる（OOM キラーが誰かを落とす代わりに）。PostgreSQL の公式文書が DB サーバーに勧める設定。
#   上限を絞った数秒の試験で 900MB の要求が 0.23 秒で断られ、他のサービスに巻き添えが無いことを確認
#   （sh/sisho_repl/29_box_overcommit_probe.sh）。
# 上限（CommitLimit）= スワップ 3.7GiB + RAM 7.14GiB × 80% ≈ 9.4GiB。ふだんの貸し出し済み（Committed_AS）は約 6GiB
#   （うち shared_buffers 5GB）＝余裕は約 3.4GiB。RAM を足したりスワップを変えたりしたら割合を見直す。
# 戻すとき: このファイルを消して sudo sysctl -w vm.overcommit_memory=0 vm.overcommit_ratio=50
vm.overcommit_memory = 2
vm.overcommit_ratio = 80
