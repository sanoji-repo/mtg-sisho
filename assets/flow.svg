<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1740" viewBox="0 0 880 1740" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">mtg_sisho データの流れ</title>
<desc id="desc">指定された七つの出所から取り込み・加工・公開へ至るデータの流れ。Scryfall のバルクから英語のカード本体、日本語名と日本語本文、公式裁定を取得。Wizards of the Coast から総合ルールの条文と用語集を取得。MTGO 公式デッキリストと MTGTop8 から大会デッキ、Moxfield から多人数統率者戦の公開デッキ、MTGJSON AllDeckFiles から構築済み製品のデッキを取得。出所ごとの脚本で取得済みをスキップし、同じコマンドで新規分だけを取り込む。元の情報を保持し、デッキのカード名は出所の表記のまま保存する。後からカード本文の構造化、デッキとカードの非破壊の対応付け、フォーマット別採用率、共起の集計を行う。17Lands Public Datasets は別経路で、S3 の公開ファイルを一セット一回取得し、gz を流し読みしてセットとカードごとの集計値だけを表に保存する。生データは DB にもリポジトリにも入れず再配布しない。公開対象のデータは論理レプリケーションで公開サーバーへ流れる。矢印はデータの流れを表す。</desc>
