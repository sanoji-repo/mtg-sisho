<svg xmlns="http://www.w3.org/2000/svg" width="880" height="2000" viewBox="0 0 880 2000" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">mtg_sisho 配置図</title>
<desc id="desc">開発機は家の Ubuntu 仮想マシンで、取り込み・集計と正本の PostgreSQL 18 publisher を持つ。別の Ubuntu Server 機は公開用 PostgreSQL 18 subscriber、門つき MCP サーバー、Tailscale Funnel、自機の見張りを持つ。論理レプリケーションの接続開始は公開サーバーから開発機へ、データの流れは開発機から公開サーバーへ。これらは同じ通信を二つの意味で描いたものである。初期化と作り直しでは開発側で公開用 dump を作り、公開側で復元する。MCP は readonly_ai で DB を読み、Funnel が 8765 をインターネットへ公開する。利用者の AI と開発機の外部監視は公開 URL に接続する。ACL は開発機から公開側の SSH と 8765 を許可し、公開側から他ノードへは原則拒否。開発側 PG へのレプリケーション接続は例外。プレイヤー名は開発側 players 表に隔離し、publication と dump に含めない。定期実行とバックアップの周期は図内に記載。破線は接続開始、実線は処理・データ方向、双方向矢印は要求と応答。</desc>
